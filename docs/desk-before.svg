<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" width="640" height="250">
  <title>Unplugged: the cable is out and the windows are piled on the laptop</title>
  <defs>
    <clipPath id="lapA"><rect x="60" y="34" width="200" height="124" rx="2"/></clipPath>
    <g id="dotsA">
      <circle cx="7" cy="5" r="1.7" fill="#ff5f57"/>
      <circle cx="13.5" cy="5" r="1.7" fill="#febc2e"/>
      <circle cx="20" cy="5" r="1.7" fill="#28c840"/>
    </g>
  </defs>

  <ellipse cx="160" cy="200" rx="140" ry="7" fill="#14181a" opacity=".05"/>
  <ellipse cx="486" cy="192" rx="110" ry="6" fill="#14181a" opacity=".04"/>

  <!-- The laptop. Everything that was on the second screen is here now,
       too big for it and stacked on top of itself. -->
  <rect x="52" y="26" width="216" height="140" rx="9" fill="#2f3a3e"/>
  <circle cx="160" cy="30.5" r="1.8" fill="#5b666b"/>
  <rect x="60" y="34" width="200" height="124" rx="2" fill="#ffffff"/>
  <g clip-path="url(#lapA)">
    <g transform="translate(56,52)">
      <rect width="150" height="96" rx="5" fill="#ffffff" stroke="#b23f3a" stroke-width="1.3"/>
      <rect width="150" height="11" rx="5" fill="#f5f7f8"/>
      <use href="#dotsA" x="0" y="1"/>
      <rect x="9" y="18" width="124" height="6" rx="3" fill="#e2e7e9"/>
      <rect x="9" y="30" width="132" height="30" rx="3" fill="#e4f1f0"/>
      <rect x="9" y="66" width="106" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="9" y="76" width="80" height="4.5" rx="2.2" fill="#e2e7e9"/>
    </g>
    <g transform="translate(94,42)">
      <rect width="150" height="96" rx="5" fill="#ffffff" stroke="#b23f3a" stroke-width="1.3"/>
      <rect width="150" height="11" rx="5" fill="#f5f7f8"/>
      <use href="#dotsA" x="0" y="1"/>
      <rect x="9" y="19" width="62" height="5" rx="2.5" fill="#e2e7e9"/>
      <rect x="9" y="33" width="132" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="9" y="45" width="132" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="9" y="57" width="132" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="9" y="69" width="104" height="4.5" rx="2.2" fill="#e2e7e9"/>
    </g>
    <g transform="translate(132,66)">
      <rect width="150" height="96" rx="5" fill="#ffffff" stroke="#b23f3a" stroke-width="1.3"/>
      <rect width="150" height="11" rx="5" fill="#f5f7f8"/>
      <use href="#dotsA" x="0" y="1"/>
      <rect x="9" y="19" width="54" height="4.5" rx="2.2" fill="#e4f1f0"/>
      <rect x="16" y="30" width="88" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="16" y="41" width="40" height="4.5" rx="2.2" fill="#e4f1f0"/>
      <rect x="9" y="52" width="100" height="4.5" rx="2.2" fill="#e2e7e9"/>
      <rect x="16" y="63" width="70" height="4.5" rx="2.2" fill="#e2e7e9"/>
    </g>
  </g>
  <!-- The base: silver, with the dark keyboard and the trackpad in front. -->
  <path d="M44 166h232l22 30H22z" fill="#e7ecee"/>
  <path d="M44 166h232l3 4H41z" fill="#cfd8da"/>
  <path d="M58 172h204l10 15H48z" fill="#2f3a3e"/>
  <g fill="#6f7d82">
    <rect x="61" y="174.2" width="196" height="2" rx="1"/>
    <rect x="59.5" y="178.2" width="199" height="2" rx="1"/>
    <rect x="58" y="182.2" width="202" height="2" rx="1"/>
  </g>
  <rect x="136" y="188" width="48" height="5" rx="2.5" fill="#cfd8da"/>
  <rect x="22" y="193" width="276" height="3" rx="1.5" fill="#cfd8da"/>
  <rect x="143" y="193" width="34" height="3" rx="1.5" fill="#b9c4c7"/>

  <!-- The cable, out of the panel and lying on the desk. This is the whole
       point of the row: the second screen is not connected. -->
  <path d="M292 180c24 12 34 22 54 24" fill="none" stroke="#8b989c" stroke-width="3" stroke-linecap="round"/>
  <rect x="344" y="199" width="12" height="8" rx="2" fill="#5b666b" transform="rotate(10 350 203)"/>

  <!-- The portable monitor, dark: nothing is coming down the wire. -->
  <g opacity=".6">
    <rect x="372" y="44" width="228" height="138" rx="7" fill="#8f9ba0"/>
    <rect x="378" y="50" width="216" height="126" rx="2" fill="#f5f7f8" stroke="#cfd8da" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M456 186h60l13 20h-86z" fill="#cfd8da"/>
    <rect x="396" y="182" width="180" height="4" rx="2" fill="#cfd8da"/>
    <rect x="366" y="150" width="8" height="14" rx="2" fill="#8f9ba0"/>
  </g>
</svg>
